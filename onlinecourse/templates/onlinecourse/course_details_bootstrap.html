<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ course.name }} | OnlineCourse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="mb-4">
      <h1 class="display-5 fw-bold">{{ course.name }}</h1>
      <p class="lead text-secondary">{{ course.description }}</p>
    </div>
    <div class="row g-4">
      {% for lesson in course.lessons.all %}
      <div class="col-md-6">
        <article class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="h5">{{ forloop.counter }}. {{ lesson.title }}</h2>
            <p class="card-text">{{ lesson.content }}</p>
            <a class="btn btn-primary" href="{% url 'exam' lesson.id %}">Take mock exam</a>
          </div>
        </article>
      </div>
      {% empty %}
      <p class="text-secondary">No lessons have been published yet.</p>
      {% endfor %}
    </div>
  </main>
</body>
</html>
