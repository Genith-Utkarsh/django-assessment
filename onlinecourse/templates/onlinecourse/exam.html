<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ exam.title }} | Mock Exam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 850px">
    <h1 class="mb-4">{{ exam.title }}</h1>
    <form method="post">
      {% csrf_token %}
      {% for question in questions %}
      <fieldset class="card mb-3 shadow-sm">
        <div class="card-body">
          <legend class="h5">{{ forloop.counter }}. {{ question.content }} <small class="text-secondary">({{ question.grade }} point{{ question.grade|pluralize }})</small></legend>
          {% for choice in question.choices.all %}
          <div class="form-check">
            <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" id="choice-{{ choice.id }}" required>
            <label class="form-check-label" for="choice-{{ choice.id }}">{{ choice.content }}</label>
          </div>
          {% endfor %}
        </div>
      </fieldset>
      {% empty %}
      <div class="alert alert-warning">This exam has no questions yet.</div>
      {% endfor %}
      <button class="btn btn-success btn-lg" type="submit">Submit exam</button>
    </form>
  </main>
</body>
</html>
